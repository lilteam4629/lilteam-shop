<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="900" height="520" rx="32" fill="#17131f"/><text x="55" y="70" fill="#6ee7b7" font-family="Tahoma,sans-serif" font-size="30" font-weight="700">คู่มือ SlipCheck — ฟรี 500 ครั้ง/เดือน</text><g font-family="Tahoma,sans-serif"><g fill="#282132"><rect x="55" y="110" width="790" height="72" rx="18"/><rect x="55" y="200" width="790" height="72" rx="18"/><rect x="55" y="290" width="790" height="72" rx="18"/><rect x="55" y="380" width="790" height="72" rx="18"/></g><g fill="#fff" font-size="21"><text x="82" y="154">1  สมัครที่ mxrslip.lovable.app แล้วเข้าแดชบอร์ด</text><text x="82" y="244">2  กดสร้าง API Key และคัดลอกทันที (คีย์แสดงครั้งเดียว)</text><text x="82" y="334">3  กลับมาหน้านี้ เลือก SlipCheck แล้ววาง API Key</text><text x="82" y="424">4  กดทดสอบ → บันทึก → ทดลองด้วยสลิปจริงยอดต่ำ</text></g></g><text x="55" y="490" fill="#78e6ad" font-family="Tahoma,sans-serif" font-size="17">✓ ดูโควตาและประวัติการตรวจได้จากแดชบอร์ด SlipCheck</text></svg>
