<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="900" height="520" rx="32" fill="#17131f"/><text x="55" y="70" fill="#c4b5fd" font-family="Tahoma,sans-serif" font-size="30" font-weight="700">คู่มือ Slip2Go สำหรับร้านของคุณ</text><g font-family="Tahoma,sans-serif"><g fill="#282132"><rect x="55" y="110" width="790" height="72" rx="18"/><rect x="55" y="200" width="790" height="72" rx="18"/><rect x="55" y="290" width="790" height="72" rx="18"/><rect x="55" y="380" width="790" height="72" rx="18"/></g><g fill="#fff" font-size="21"><text x="82" y="154">1  สมัครและเลือกแพ็กเกจที่ slip2go.com</text><text x="82" y="244">2  เปิดหน้า API/Developer แล้วคัดลอก API Key</text><text x="82" y="334">3  กลับมาหน้านี้ เลือก Slip2Go แล้ววาง API Key</text><text x="82" y="424">4  กดทดสอบ → บันทึก → ทดลองสลิปจริงก่อนเปิดร้าน</text></g></g><text x="55" y="490" fill="#78e6ad" font-family="Tahoma,sans-serif" font-size="17">✓ ค่าแพ็กเกจและโควตาเป็นของเจ้าของร้านนี้เอง</text></svg>
