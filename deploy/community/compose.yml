services:
  mongodb:
    image: mongo:8.0-noble
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - /opt/lilteam/data/mongodb:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  app-blue: &app
    build:
      context: ../..
      dockerfile: Dockerfile
    image: lilteam-app:${LILTEAM_IMAGE_TAG:-latest}
    container_name: lilteam-app-blue
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: /opt/lilteam/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGODB_DB_NAME:-lilteam_shop}?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 24
    networks: [internal]

  app-green:
    <<: *app
    container_name: lilteam-app-green

  proxy:
    image: nginx:1.27-alpine
    container_name: lilteam-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/lilteam/runtime:/etc/nginx/dynamic:ro
    networks: [internal]

networks:
  internal:
    driver: bridge
